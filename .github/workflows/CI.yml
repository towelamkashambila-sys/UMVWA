name: UMVWA CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
      - run: PYTHONPATH=. PYTHONWARNINGS=error pytest -q
      - run: python -m compileall -q app canonical_src
